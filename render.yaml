# Render Blueprint 部署配置（展示版 / 方案 A）
# 用法：把本仓库推到 GitHub/GitLab → Render 控制台 New → Blueprint → 选择本仓库，
#       即可一键部署。本配置【不挂持久磁盘】，服务直接读取仓库内已提交的
#       data/projects.json 与 public/uploads/（DATA_ROOT 缺省即指向仓库根 /app），
#       因此线上展示内容与本地完全一致（含本次新增的 CAD 示例项目）。
# 代价：后台新上传的作品在实例重启后会丢失，仅适合「展示」用途。
# 如需上传持久化，请改回带 disks + DATA_ROOT=/data 的版本。
services:
  - type: web
    name: portfolio-site
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                 # free 有休眠（15 分钟无访问后睡，唤醒有冷启动）；需常驻改 starter（付费）
    region: oregon             # 可改 singapore / frankfurt / ohio 等就近区域
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false            # 部署后在 Render 控制台「Environment」手动填入强密码（务必改！）
          # 注意：此处已删除 DATA_ROOT，服务默认读仓库根目录 /app 下的 data/ 与 public/uploads/
