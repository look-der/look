<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 作品集</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .admin-wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 80px; }
    .admin-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px; }
    .admin-title { font-size: 22px; margin: 0 0 4px; }
    .admin-hint { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }
    .form-row { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    input[type=text], input[type=password], textarea, select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 14px; font-family: inherit; background: #fff; color: var(--ink);
    }
    textarea { min-height: 90px; resize: vertical; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .file-drop {
      border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px;
      text-align: center; color: var(--ink-soft); cursor: pointer; transition: border-color .2s;
    }
    .file-drop:hover { border-color: var(--accent); color: var(--accent); }
    .existing-files { margin-top: 10px; display: grid; gap: 8px; }
    .ef-item { display: flex; align-items: center; gap: 10px; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .ef-item .ef-name { flex: 1; word-break: break-all; }
    .ef-remove { color: #e0533d; cursor: pointer; font-weight: 600; }
    .msg { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; display: none; }
    .msg.ok { display: block; background: #e8f7ef; color: #1f9d6b; }
    .msg.err { display: block; background: #fdecea; color: #e0533d; }
    .admin-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .admin-top a, .admin-top button { font-size: 14px; }
    .list-item { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .list-item .li-main { flex: 1; }
    .li-title { font-weight: 700; font-size: 15px; }
    .li-meta { color: var(--ink-soft); font-size: 13px; }
    .li-actions { display: flex; gap: 8px; }
    .mini-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; }
    .mini-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .mini-btn.danger { color: #e0533d; border-color: #f3c4bd; }
    .hidden { display: none !important; }
    @media (max-width:600px){ .two-col{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">作品集<span class="brand-dot">.</span></a>
      <nav class="nav-links"><a href="/">返回展示页</a></nav>
    </div>
  </header>

  <div class="admin-wrap">
    <!-- 登录 -->
    <div class="admin-card" id="loginBox">
      <h1 class="admin-title">管理后台登录</h1>
      <p class="admin-hint">请输入后台密码（在 config.js 的 adminPassword 中设置）。</p>
      <div class="msg" id="loginMsg"></div>
      <div class="form-row">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" id="loginBtn">登录</button>
    </div>

    <!-- 管理主体 -->
    <div class="admin-card hidden" id="panelBox">
      <div class="admin-top">
        <h1 class="admin-title" id="formHeading">新增作品</h1>
        <div>
          <button class="mini-btn" id="resetBtn">新建</button>
          <button class="mini-btn danger" id="logoutBtn">退出登录</button>
        </div>
      </div>
      <p class="admin-hint">填写信息并选择文件，提交后归入所选分类；图纸（图片）会自动作为封面。</p>
      <div class="msg" id="formMsg"></div>

      <form id="projectForm">
        <input type="hidden" id="projId" />
        <div class="form-row">
          <label for="title">作品标题 *</label>
          <input type="text" id="title" placeholder="如：某框架结构课程设计" required />
        </div>
        <div class="two-col">
          <div class="form-row">
            <label for="category">分类栏目 *</label>
            <select id="category"></select>
          </div>
          <div class="form-row">
            <label for="date">日期</label>
            <input type="text" id="date" placeholder="如 2026-06（默认今天）" />
          </div>
        </div>
        <div class="form-row">
          <label for="summary">一句话简介</label>
          <input type="text" id="summary" placeholder="卡片上显示的简短说明" />
        </div>
        <div class="form-row">
          <label for="tags">标签（逗号分隔）</label>
          <input type="text" id="tags" placeholder="如：混凝土楼盖, 框架结构" />
        </div>
        <div class="form-row">
          <label for="description">详细说明</label>
          <textarea id="description" placeholder="设计背景、结构选型、主要计算结果、图纸清单等"></textarea>
        </div>
        <div class="form-row">
          <label>上传文件（图纸 / 计算书 / 源文件，可多选）</label>
          <div class="file-drop" id="drop">点击选择文件，或把文件拖到这里</div>
          <input type="file" id="files" multiple class="hidden" />
          <div class="existing-files" id="existingFiles"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">提交作品</button>
      </form>

      <hr style="border:none;border-top:1px solid var(--line);margin:30px 0 20px;" />
      <h2 class="admin-title" style="font-size:18px;">已有作品（<span id="count">0</span>）</h2>
      <div id="list"></div>
    </div>
  </div>

  <script src="/assets/js/admin.js"></script>
</body>
</html>
